- name: install packages
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install package
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
  loop:
  - { name: "mysql8.4-server", state: "absent"}
  - { name: "nginx", state: "present"}
  - { name: "zip", state: "present"}
  