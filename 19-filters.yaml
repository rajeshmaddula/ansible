- name: demo on the filters
  hosts: local
  connection: local
  vars:
    topics: linu, shell ansible, terraform
    tags:
      name: ansible
      project: roboshop
      component: catalogue
  tasks:
  - name: greeting
    ansible.builtin.debug:
      msg: "Hi Sam, {{ greeting | default('Good Morning') }}"
  
  - name: convert string to list
    ansible.builtin.debug:
      msg: " {{ topics | split(',')}}"
  
  - name: convert map to list
    ansible.builtin.debug:
    msg "{{ tags | dict2items }}"