- name: demo on error handling
  hosts: local
  connection: local
  tasks:
  - name: chek if the user exits
    ansible.builtin.command: id rajesh
    register: user_output
    ignore_errors: true

  - name: Print the return code
    ansible.builtin.debug:
      msg: "The return code is {{ user_output.rc }}"

  - name: print the user_output
    ansible.builtin.debug:
      msg: "{{ user_output}}"

  - name: create user
    ansible.builtin.command: useradd rajesh
    when: user_output.rc != 0